name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest
    env:
      SSH_PRIVATE_KEY: ${{secrets.SSH_PRIVATE_KEY}}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      EC2_HOST_IP: ${{ secrets.EC2_HOST_IP }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: cd server && terraform init
      - name: Terraform Plan
        run: cd server && terraform plan -var="public_key=${SSH_PUBLIC_KEY}"
      - name: Create server and get EC2 IP
        id: create-server
        run: |
          cd server
          terraform apply --auto-approve -var="public_key=${SSH_PUBLIC_KEY}"
          IP=$(terraform output -raw ec2_public_ip)
          echo "EC2 IP: $IP"
          echo "ec2_ip=$IP" >> $GITHUB_OUTPUT
        
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t zoelucas/hello-app:${{ github.sha }} .

      - name: Push Docker image
        run: docker push zoelucas/hello-app:${{ github.sha }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ steps.create-server.outputs.ec2_ip }} >> ~/.ssh/known_hosts

      - name: SSH into EC2, install docker, and run image and view website through curl before runner ends.
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ steps.create-server.outputs.ec2_ip }} << 'EOF'

          sudo apt-get update
          sudo apt-get install -y \
          ca-certificates \
          curl \
          gnupg \
          lsb-release

          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | \
          sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
            https://download.docker.com/linux/ubuntu \
            $(lsb_release -cs) stable" | \
            sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            echo "You passed log in!"
            sudo docker pull zoelucas/hello-app:${{ github.sha }}
            sudo docker run -d -p 80:80 zoelucas/hello-app:${{ github.sha }}
            sleep 5
            curl http://localhost:80
          EOF
      
      - name: Destroy tf infrastructure
        run: cd server && terraform destroy --auto-approve -var="public_key=${SSH_PUBLIC_KEY}"
